name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stocksight_test
          POSTGRES_USER: stocksight
          POSTGRES_PASSWORD: ci-only-disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stocksight -d stocksight_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      STOCKSIGHT_TEST_DATABASE_URL: postgresql+psycopg://stocksight:ci-only-disposable@127.0.0.1:5432/stocksight_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check . ../scripts
      - run: python -m ruff format --check . ../scripts
      - run: python -m pytest

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stocksight_test
          POSTGRES_USER: stocksight
          POSTGRES_PASSWORD: ci-only-disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stocksight -d stocksight_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      STOCKSIGHT_DATABASE_URL: postgresql+psycopg://stocksight:ci-only-disposable@127.0.0.1:5432/stocksight_test
      STOCKSIGHT_E2E_DATABASE_URL: postgresql+psycopg://stocksight:ci-only-disposable@127.0.0.1:5432/stocksight_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - run: .venv/bin/python -m alembic upgrade head
        working-directory: backend
      - run: .venv/bin/python -m app.seed
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run test:e2e:accounts
        working-directory: frontend
        env:
          STOCKSIGHT_E2E_ACCOUNTS_DATABASE_URL: postgresql+psycopg://stocksight:ci-only-disposable@127.0.0.1:5432/stocksight_test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7
