name: Check live deployment

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-check
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false
      - name: Verify production frontend, database API and private-route protection
        env:
          PRODUCTION_URL: https://stocksight-cse4095.vercel.app
        run: python3 scripts/check_deployment.py "$PRODUCTION_URL"
