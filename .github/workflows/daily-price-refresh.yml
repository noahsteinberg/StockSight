name: Daily price refresh

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview checks data without writing; update applies validated changes.
        type: choice
        options: [preview, update]
        default: preview
        required: true
  schedule:
    # Tuesday-Saturday mornings follow Monday-Friday trading sessions.
    - cron: '17 1,6 * * 2-6'
      timezone: America/New_York

permissions:
  contents: read

concurrency:
  group: stocksight-daily-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.repository == 'noahsteinberg/StockSight' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       vars.STOCKSIGHT_REFRESH_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install updater dependencies
        run: python -m pip install -r backend/requirements-refresh.txt
      - name: Preview or update stored daily prices
        working-directory: backend
        env:
          STOCKSIGHT_DATABASE_URL: ${{ secrets.STOCKSIGHT_REFRESH_DATABASE_URL }}
          REFRESH_MODE: ${{ github.event_name == 'schedule' && 'update' || inputs.mode }}
        run: |
          if [ -z "$STOCKSIGHT_DATABASE_URL" ]; then
            echo '::error::Add the STOCKSIGHT_REFRESH_DATABASE_URL Actions secret first.'
            exit 1
          fi
          write_args=()
          if [ "$REFRESH_MODE" = 'update' ]; then
            write_args=(--write)
          elif [ "$REFRESH_MODE" != 'preview' ]; then
            echo '::error::Unsupported refresh mode.'
            exit 1
          fi
          mkdir -p .local-data
          python -m app.refresh_prices --all-supported "${write_args[@]}" --report .local-data/refresh.json > .local-data/refresh-console.txt 2>&1
      - name: Record per-stock results
        if: always()
        run: python scripts/summarize_refresh.py backend/.local-data/refresh.json
      - name: Verify deployed API after updates
        if: success() && (github.event_name == 'schedule' || inputs.mode == 'update')
        run: python scripts/check_deployment.py https://stocksight-rose.vercel.app
