services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: stocksight
      POSTGRES_USER: stocksight
      POSTGRES_PASSWORD: ${STOCKSIGHT_DB_PASSWORD:?Set STOCKSIGHT_DB_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - stocksight_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksight -d stocksight"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  stocksight_pg:
