[project]
name = "stocksight-api"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "uvicorn==0.54.0",
    "SQLAlchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "PyJWT[crypto]==2.15.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
